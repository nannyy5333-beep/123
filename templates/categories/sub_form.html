
{% extends "layouts/base.html" %}
{% block content %}
<h4>{{ "Новая подкатегория" if not item else ("Редактирование подкатегории #"+item.id|string) }}</h4>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Категория</label>
    <select class="form-select" name="category_id" required>
      {% for c in cats %}
        <option value="{{ c.id }}" {{ "selected" if item and item.category_id==c.id }}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Название</label>
    <input class="form-control" name="name" value="{{ item.name if item else '' }}" required>
  </div>
  <div class="col-12">
    <button class="btn btn-dark">Сохранить</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('categories.list_') }}">Назад</a>
  </div>
</form>
{% endblock %}
