
{% extends "layouts/base.html" %}
{% block content %}
<h4>{{ "Новый товар" if not item else ("Редактирование #"+item.id|string) }}</h4>
<form method="post" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Название</label>
    <input class="form-control" name="name" value="{{ item.name if item else '' }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Цена</label>
    <input class="form-control" type="number" step="0.01" name="price" value="{{ item.price if item else '' }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Остаток</label>
    <input class="form-control" type="number" name="stock" value="{{ item.stock if item else 0 }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Категория (текст)</label>
    <input class="form-control" name="category" value="{{ item.category if item else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Подкатегория</label>
    <select class="form-select" name="subcategory_id">
      <option value="">—</option>
      {% for s in subs %}
        <option value="{{ s.id }}" {{ "selected" if item and item.subcategory_id==s.id }}>{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12">
    <label class="form-label">Описание</label>
    <textarea class="form-control" rows="4" name="description">{{ item.description if item else '' }}</textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-dark">Сохранить</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('products.list_') }}">Отмена</a>
  </div>
</form>
{% endblock %}
