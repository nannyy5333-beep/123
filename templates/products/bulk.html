
{% extends "layouts/base.html" %}
{% block content %}
<h4>Пакетные операции</h4>
<p class="text-muted">Загрузи CSV/Excel. Для upsert ожидаются колонки: id(опц.), name, price, stock, category, description.</p>
<form method="post" enctype="multipart/form-data" class="row g-3">
  <div class="col-12">
    <input type="file" class="form-control" name="file" accept=".csv,.xlsx" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Режим</label>
    <select class="form-select" name="mode" required>
      <option value="upsert">Upsert (создать/обновить)</option>
      <option value="price_pct">Изменить цены на % (по id)</option>
      <option value="stock_set">Установить остаток (по id)</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Процент для цен (если выбран price_pct)</label>
    <input class="form-control" type="number" step="0.01" name="pct" placeholder="например 10">
  </div>
  <div class="col-12">
    <button class="btn btn-dark">Применить</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('products.list_') }}">Назад</a>
  </div>
</form>
{% if info %}<div class="alert alert-info mt-3">{{ info }}</div>{% endif %}
{% endblock %}
