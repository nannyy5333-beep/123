
{% extends "layouts/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Серии по периодам</h4>
  <form class="d-flex" method="get">
    <input class="form-control me-2" type="date" name="date_from" value="{{ date_from }}">
    <input class="form-control me-2" type="date" name="date_to" value="{{ date_to }}">
    <select class="form-select me-2" name="group">
      {% for g in ["day","week","month"] %}
        <option value="{{ g }}" {{ "selected" if group==g }}>{{ g }}</option>
      {% endfor %}
    </select>
    <button class="btn btn-outline-secondary">Применить</button>
  </form>
</div>
<div class="card my-3"><div class="card-body">
  <canvas id="tsChart" height="90"></canvas>
</div></div>
<script>
const tsData = {{ ts|tojson }};
new Chart(document.getElementById('tsChart'), {
  type:'bar',
  data:{labels: tsData.labels, datasets:[
    {label:'Выручка', type:'line', data: tsData.revenue},
    {label:'Заказы', type:'bar', data: tsData.orders}
  ]},
  options:{responsive:true, scales:{y:{beginAtZero:true}}}
});
</script>
{% endblock %}
