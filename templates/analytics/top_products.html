
{% extends "layouts/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Топ товаров по выручке</h4>
  <form class="d-flex" method="get">
    <input class="form-control me-2" type="date" name="date_from" value="{{ date_from }}">
    <input class="form-control me-2" type="date" name="date_to" value="{{ date_to }}">
    <button class="btn btn-outline-secondary">Применить</button>
  </form>
</div>
<div class="card my-3"><div class="card-body">
  <canvas id="topProd" height="80"></canvas>
</div></div>
<script>
const labels = {{ (items|map(attribute='name')|list)|tojson }};
const vals = {{ (items|map(attribute='revenue')|list)|tojson }};
new Chart(document.getElementById('topProd'), {
  type:'bar',
  data:{labels: labels, datasets:[{label:'Выручка', data: vals}]},
  options:{responsive:true, scales:{y:{beginAtZero:true}}}
});
</script>
<div class="table-responsive">
<table class="table table-sm table-striped">
  <thead><tr><th>#</th><th>Товар</th><th>Выручка</th></tr></thead>
  <tbody>
    {% for it in items %}
      <tr><td>{{ loop.index }}</td><td>{{ it.name }}</td><td>{{ "%.2f"|format(it.revenue) }}</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
